# One command brings up MySQL + the management API + the web UI:
#   cp .env.example .env && docker compose up --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: gatekeeper_management
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3306:3306"

  management:
    build: ./api-management-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gatekeeper_management
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      GATEKEEPER_JWT_SECRET: ${GATEKEEPER_JWT_SECRET:-dev-only-secret-change-me-32-bytes-min!!}
      GATEKEEPER_JWT_TTL_MINUTES: ${GATEKEEPER_JWT_TTL_MINUTES:-60}
      GATEKEEPER_CORS_ORIGINS: http://localhost:3000
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-Admin@12345}
      GATEWAY_SERVICE_PASSWORD: ${GATEWAY_SERVICE_PASSWORD:-Gateway@12345}
      GATEKEEPER_DEMO_DATA: ${GATEKEEPER_DEMO_DATA:-true}
    ports:
      - "8081:8081"

  frontend:
    build: ./frontend
    depends_on:
      - management
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:80"

volumes:
  mysql-data:
