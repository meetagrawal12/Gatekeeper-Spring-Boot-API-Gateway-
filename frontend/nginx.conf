server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS; upstreams are resolved per request so nginx starts
  # even if gateway/analytics are not running.
  resolver 127.0.0.11 valid=10s;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Control-plane API (api-management-service)
  location /api/ {
    set $mgmt http://management:8081;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $mgmt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Health probes for the other two services (run on the Docker host during development)
  location /svc/gateway/ {
    set $gw http://host.docker.internal:8080;
    rewrite ^/svc/gateway/(.*)$ /$1 break;
    proxy_pass $gw;
  }
  location /svc/analytics/ {
    set $an http://host.docker.internal:8082;
    rewrite ^/svc/analytics/(.*)$ /$1 break;
    proxy_pass $an;
  }

  # Single-page app fallback
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
