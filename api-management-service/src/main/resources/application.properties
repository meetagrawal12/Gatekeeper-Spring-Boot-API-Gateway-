spring.application.name=api-management-service
server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

# ---- Database (override with env vars in production) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gatekeeper_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Meet@1112004}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# ---- Security ----
# HS256 signing key, minimum 32 bytes. ALWAYS override in production.
gatekeeper.jwt.secret=${GATEKEEPER_JWT_SECRET:dev-only-secret-change-me-32-bytes-min!!}
gatekeeper.jwt.ttl-minutes=${GATEKEEPER_JWT_TTL_MINUTES:60}
gatekeeper.cors.allowed-origins=${GATEKEEPER_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Bootstrap (leave blank in production once passwords are set) ----
gatekeeper.bootstrap.platform-admin-password=${PLATFORM_ADMIN_PASSWORD:}
gatekeeper.bootstrap.gateway-service-password=${GATEWAY_SERVICE_PASSWORD:}
gatekeeper.bootstrap.demo-data=${GATEKEEPER_DEMO_DATA:false}
